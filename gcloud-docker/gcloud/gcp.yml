- name: Configure the new instances for Redis, NGINX, and Django
  hosts: new_instances
  connection: ssh
  remote_user: csci644
  gather_facts: yes
  become: yes
  vars:
    ansible_ssh_private_key_file: "./id_rsa"
    ansible_python_interpreter: "/usr/bin/python3"
    db_user: django
    db_password: django
    db_name: django
    postgres_password: postgres
  tasks:
    - name: Display the instance facts
      debug:
        var: ansible_facts
    - name: Install dependencies
      ansible.builtin.apt:
        name:
          - lsb-release
          - curl
          - gpg
          - nginx
        state: present
        update_cache: yes
        cache_valid_time: 3600
    - name: Add Redis to apt sources
      block:
        - name: Add repo using key from URL
          deb822_repository:
            name: redis
            types: deb
            uris: https://packages.redis.io/deb
            suites: '{{ ansible_facts["distribution_release"] }}'
            components: main
            architectures: amd64
            signed_by: https://packages.redis.io/gpg
        - name: Update apt cache
          ansible.builtin.apt:
            update_cache: yes
    - name: Install Redis
      ansible.builtin.apt:
        name: redis
        state: present
        update_cache: yes
        cache_valid_time: 3600

    - name: Start and enable Redis service
      ansible.builtin.systemd:
        name: redis-server
        state: started
        enabled: yes

    - name: Add NGINX configuration
      ansible.builtin.template:
        src: nginx.conf.j2
        dest: /etc/nginx/sites-available/new_instance.conf
        owner: root
        group: root
        mode: '0644'
    - name: Remove default NGINX configuration
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
    - name: Enable new NGINX configuration
      ansible.builtin.file:
        src: /etc/nginx/sites-available/new_instance.conf
        dest: /etc/nginx/sites-enabled/new_instance.conf
        state: link
    - name: Restart NGINX service
      ansible.builtin.systemd:
        name: nginx
        state: restarted
        enabled: yes
    - name: Django Migrate
      ansible.builtin.shell:
        cmd: "/home/csci644/MinimalMicroService/Backend/venv/bin/python /home/csci644/MinimalMicroService/Backend/chatexample/manage.py migrate"
      
    - name: Create MinimalMicroService systemd service
      ansible.builtin.template:
        src: django.service.j2
        dest: /etc/systemd/system/minimalmicroservice.service
        owner: root
        group: root
        mode: '0644'
    - name: Reload systemd daemon
      ansible.builtin.systemd:
        daemon_reload: yes
    - name: Start and enable MinimalMicroService service
      ansible.builtin.systemd:
        name: minimalmicroservice
        state: started
        enabled: yes