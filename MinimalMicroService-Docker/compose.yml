services:
  redis:
    image: redis:alpine
    restart: always
    expose:
      - "6379"
  
  postgres:
    image: postgres:alpine
    restart: always
    environment:
      POSTGRES_USER: django
      POSTGRES_PASSWORD: django
      POSTGRES_DB: django
    expose:
      - "5432"
  
  backend:
    build: 
      context: ./Backend
      dockerfile: Dockerfile
    restart: always
    volumes:
      - ./Backend:/app
    depends_on:
      - redis
      - postgres
    links:
      - redis:redis
      - postgres:postgres
    expose:
      - "8000"
    working_dir: /app/chatexample
    command: python manage.py runserver 0.0.0.0:8000
  
  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./NGINX/default.conf:/etc/nginx/conf.d/default.conf
      - ./Backend/static:/var/www/html/static